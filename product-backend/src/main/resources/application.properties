spring.application.name=product-backend

# H2 in-memory database; data resets on restart
spring.datasource.url=jdbc:h2:mem:products;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# data.sql runs after Hibernate creates the table
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Strict JSON typing (PRODUCT-S12)
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
# Unknown fields are ignored (PRODUCT-S07); Boot's default, stated for clarity
spring.jackson.deserialization.fail-on-unknown-properties=false
